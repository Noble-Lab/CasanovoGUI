name: build & release

# Builds the portable JAR and the per-OS native packages, and publishes each file as a
# SEPARATE asset on a GitHub Release. jpackage can only target the OS it runs on, so each
# native package is built on its own runner.
#
#   push tag  v1.2.3            -> Release "v1.2.3" (marked latest), each file attached
#   PR + label 'build-artifact' -> prerelease "pr-build-<N>" with downloadable links (test builds)
#   workflow_dispatch           -> same files uploaded as workflow artifacts (no Release)
#
# Every built file is named CasanovoGUI-<version>-<platform>.<ext> for consistency:
#   CasanovoGUI-1.0.0.jar                     (portable, needs a JDK 23+)
#   CasanovoGUI-1.0.0-linux-x86_64.tar.gz     (Linux portable: no root, no Java)
#   CasanovoGUI-1.0.0-linux-x86_64.deb        (Linux install, root)
#   CasanovoGUI-1.0.0-macos-arm64.dmg         (Apple Silicon; Intel Macs use the portable JAR)
#   CasanovoGUI-1.0.0-windows-x64.zip         (Windows app-image, no install/Java)

on:
  push:
    tags: ['v*']
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

# Required for softprops/action-gh-release to create/update Releases.
permissions:
  contents: write

jobs:
  # Cross-platform portable JAR (Windows + Linux + macOS Apple Silicon; needs a JDK 23+).
  portable-jar:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-artifact')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          fi
          echo "VER=$V" >> "$GITHUB_ENV"
      - name: Build portable JAR
        run: mvn -B -Pportable -DskipTests clean package
      - name: Collect asset
        shell: bash
        run: |
          mkdir -p release
          JAR="$(ls target/casanovo-gui-*.jar | grep -vE 'original|shaded' | head -1)"
          cp "$JAR" "release/CasanovoGUI-$VER.jar"
          ls -la release/
      - name: Publish to Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'build-artifact'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event_name == 'push' && github.ref_name || format('pr-build-{0}', github.event.pull_request.number) }}"
          name: "${{ github.event_name == 'push' && github.ref_name || format('Pre-release build (PR #{0})', github.event.pull_request.number) }}"
          prerelease: ${{ github.event_name == 'pull_request' }}
          make_latest: ${{ (github.event_name == 'push') && 'true' || 'false' }}
          files: release/*
      - name: Upload artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: CasanovoGUI-portable-jar
          path: release/*
          if-no-files-found: error

  # Native packages, one per OS (and per macOS architecture).
  native:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-artifact')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, arch: x64 }
          - { os: ubuntu-latest,  name: linux,   arch: x86_64 }
          # Apple Silicon only. Native Intel-mac dropped: GitHub's macos-13 (Intel) runners
          # queue for ages; Intel-Mac users run the cross-platform portable JAR (needs a JDK).
          - { os: macos-15,       name: macos,   arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          fi
          echo "VER=$V" >> "$GITHUB_ENV"
      - name: Install Linux packaging tools
        if: matrix.name == 'linux'
        run: |
          # A preinstalled packages.microsoft.com apt repo intermittently serves an invalid
          # signature, which makes `apt-get update` fail (exit 100); we don't use it, so drop it first.
          sudo grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils
      - name: Package (Windows app-image)
        if: matrix.name == 'windows'
        run: pwsh ./packaging/package.ps1
        env:
          APP_VERSION: ${{ env.VER }}
      - name: Package (Linux/macOS installer)
        if: matrix.name != 'windows'
        shell: bash
        run: APP_VERSION="$VER" bash ./packaging/package.sh --installer
      # A .deb that installs into /opt with no menu entry is reachable neither from the
      # desktop nor from a shell. Assert the shortcut is actually in the package rather than
      # trusting that the jpackage flag did what it says.
      - name: Verify the .deb is discoverable
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Glob, not `ls | head -1`: under pipefail the pipe would abort the step with no
          # message if dist/ ever held more than one .deb.
          debs=(dist/*.deb)
          [ ${#debs[@]} -eq 1 ] || { echo "::error::expected one .deb, found ${#debs[@]}"; exit 1; }
          deb="${debs[0]}"
          echo "DEB=$deb" >> "$GITHUB_ENV"
          echo "::group::$deb contents"
          dpkg-deb -c "$deb"
          echo '::endgroup::'
          contents="$(dpkg-deb -c "$deb")"
          # The .desktop file ships inside /opt and is registered at install time by postinst,
          # NOT into /usr/share/applications. Match its exact name: the bundled JDK also carries
          # legal/java.desktop directories, which a looser pattern matches by accident.
          if ! grep -q '/opt/casanovogui/lib/casanovogui-CasanovoGUI\.desktop$' <<<"$contents"; then
            echo '::error::No .desktop file in the package: the application will not appear'\
                 ' in the desktop menu. Check --linux-shortcut in packaging/package.sh.'
            exit 1
          fi
          rm -rf ctl && mkdir ctl && dpkg-deb -e "$deb" ctl
          echo '::group::postinst'; cat ctl/postinst; echo '::endgroup::'
          echo '::group::prerm'; cat ctl/prerm; echo '::endgroup::'
          # A misspelt resource-dir override is ignored silently, so assert both effects of
          # ours are present rather than trusting that jpackage picked the file up.
          grep -q 'xdg-desktop-menu install' ctl/postinst \
            || { echo '::error::postinst does not register the desktop entry'; exit 1; }
          grep -q 'update-alternatives --install /usr/bin/casanovogui' ctl/postinst \
            || { echo '::error::postinst override was ignored: no PATH entry'; exit 1; }
          grep -q 'update-alternatives --remove casanovogui' ctl/prerm \
            || { echo '::error::prerm override was ignored: PATH entry would be left behind'; exit 1; }
          # --linux-shortcut makes jpackage add this dependency; the README tells users to
          # install with `apt install ./<file>.deb` because of it, so assert it is really there.
          dpkg-deb -f "$deb" Depends | grep -q 'xdg-utils' \
            || { echo '::error::expected Depends: xdg-utils from --linux-shortcut'; exit 1; }
          echo 'deb is discoverable from both the desktop menu and PATH'

      # Inspecting the package is not enough: the defects that matter here only appear when the
      # maintainer scripts actually run. jpackage calls xdg-desktop-menu bare under `set -e`, so
      # on a machine with no writable system menu directory its postinst makes the package
      # impossible to install and its prerm makes it impossible to REMOVE -- stranding it until
      # someone edits /var/lib/dpkg by hand. Our overrides make both non-fatal; this asserts a
      # full install/remove/purge cycle really does complete, and that both things the overrides
      # exist to deliver -- the menu entry and the PATH entry -- actually appear and disappear.
      - name: Install, remove and purge the .deb
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          menu=/usr/share/applications/casanovogui-CasanovoGUI.desktop
          # `apt install ./file.deb`, not `dpkg -i || apt-get -f install`: it resolves the
          # xdg-utils dependency the same way the README tells users to, and it does not mask a
          # failing postinst behind a repair step that can "succeed" by removing the package.
          sudo apt-get install -y "./$DEB"
          command -v casanovogui \
            || { echo '::error::casanovogui is not on PATH after installation'; exit 1; }
          # The postinst deliberately swallows xdg-desktop-menu failures so a headless box can
          # still install, which means only this can prove registration actually happened.
          [ -f "$menu" ] \
            || { echo "::error::no menu entry at $menu: the desktop registration silently failed"; exit 1; }
          sudo apt-get remove -y casanovogui
          # -L as well as -e: dpkg deletes /opt/casanovogui before postrm runs, so a leftover
          # link is DANGLING, and `command -v` / `-e` alone report it as absent.
          if [ -L /usr/bin/casanovogui ] || [ -e /usr/bin/casanovogui ]; then
            echo '::error::the /usr/bin entry survived removal'; exit 1
          fi
          [ ! -f "$menu" ] \
            || { echo "::error::the menu entry at $menu survived removal"; exit 1; }
          # purge reaches the postrm branch that plain remove never enters.
          sudo dpkg -P casanovogui
          echo 'install, remove and purge all complete; menu and PATH entries added and cleaned up'

      - name: Collect release assets (consistent CasanovoGUI-<ver>-<platform> names)
        shell: bash
        run: |
          mkdir -p release
          case "${{ matrix.name }}" in
            linux)
              cp dist/*.deb "release/CasanovoGUI-$VER-linux-${{ matrix.arch }}.deb"
              cp dist/*.tar.gz release/    # already CasanovoGUI-<ver>-linux-x86_64.tar.gz
              ;;
            macos)
              cp dist/*.dmg "release/CasanovoGUI-$VER-macos-${{ matrix.arch }}.dmg"
              ;;
            windows)
              ( cd dist && 7z a "../release/CasanovoGUI-$VER-windows-${{ matrix.arch }}.zip" CasanovoGUI >/dev/null )
              ;;
          esac
          ls -la release/
      - name: Publish to Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'build-artifact'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event_name == 'push' && github.ref_name || format('pr-build-{0}', github.event.pull_request.number) }}"
          name: "${{ github.event_name == 'push' && github.ref_name || format('Pre-release build (PR #{0})', github.event.pull_request.number) }}"
          prerelease: ${{ github.event_name == 'pull_request' }}
          make_latest: ${{ (github.event_name == 'push') && 'true' || 'false' }}
          files: release/*
      - name: Upload artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: CasanovoGUI-${{ matrix.name }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
